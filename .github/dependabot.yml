version: 2

# composer is left out on purpose: dependabot would only bump composer.json,
# while every shared package has to be bumped in composer.saas.json as well.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  # CI never builds the frontend, so a green run proves nothing for npm bumps.
  # Majors (vite, tailwind, inertia, ...) are migrations and get done by hand.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # 1.8+ requires apexcharts >= 4 as a peer, which breaks npm ci until the apexcharts major is migrated
      - dependency-name: vue3-apexcharts
        versions:
          - ">= 1.8.0"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
