models:
  Project:
    name: string
    team_id: foreign
    relationships:
      belongsTo: Team
      hasMany: Instance
  Instance:
    name: string
    team_id: foreign
    project_id: foreign
    relationships:
      belongsTo: Project
      hasOne: Team
      morphTo: \Laravel\Sanctum\PersonalAccessToken

